<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GiftGenie - Smart Gift Finder</title>

  <style>
    body {
      font-family: STSong, Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      width: 90%;
      max-width: 420px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      color: #ff6f61;
      margin-bottom: 8px;
    }

    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select,
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #ff4a3d;
    }

    .result {
      margin-top: 20px;
      text-align: left;
      font-size: 15px;
      color: #333;
    }

    #ageContainer {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎁 GiftGenie</h1>
    <p>Find the perfect gift based on occasion & emotions</p>

    <label for="occasion">Occasion</label>
    <select id="occasion">
      <option value="birthday">Birthday</option>
      <option value="anniversary">Anniversary</option>
      <option value="festival">Festival</option>
      <option value="wedding">Wedding</option>
      <option value="babyShower">Baby Shower</option>
      <option value="graduation">Graduation</option>
      <option value="valentinesDay">Valentine's Day</option>
      <option value="mothersDay">Mother's Day</option>
      <option value="fathersDay">Father's Day</option>
      <option value="housewarming">Housewarming</option>
      <option value="retirement">Retirement</option>
    </select>

    <div id="ageContainer">
      <label for="age">Age</label>
      <input type="number" id="age" placeholder="Enter age" min="0" />
    </div>

    <label for="relationship">Relationship</label>
    <select id="relationship">
      <option value="friend">Friend</option>
      <option value="partner">Partner</option>
      <option value="parent">Parent</option>
      <option value="sibling">Sibling</option>
      <option value="colleague">Colleague</option>
      <option value="child">Child</option>
    </select>

    <label for="mood">Emotional State</label>
    <select id="mood">
      <option value="neutral">Neutral</option>
      <option value="happy">Happy</option>
      <option value="excited">Excited</option>
      <option value="celebratory">Celebratory</option>
      <option value="romantic">Romantic</option>
      <option value="sad">Sad</option>
      <option value="unhappy">Unhappy</option>
      <option value="angry">Angry</option>
      <option value="stressed">Stressed</option>
      <option value="tired">Tired</option>
      <option value="lonely">Lonely</option>
    </select>

    <button id="giftBtn">Get Gift Suggestions</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function toggleAgeField() {
      const occasion = document.getElementById("occasion").value;
      const ageContainer = document.getElementById("ageContainer");

      if (occasion === "birthday") {
        ageContainer.style.display = "block";
      } else {
        ageContainer.style.display = "none";
        document.getElementById("age").value = "";
      }
    }

    function suggestGift() {
      const occasion = document.getElementById("occasion").value;
      const age = parseInt(document.getElementById("age").value);
      const mood = document.getElementById("mood").value;

      let suggestions = [];

      switch (occasion) {
        case "birthday":
          if (age <= 12) suggestions = ["Toys", "Story Books", "Art Kits"];
          else if (age <= 19) suggestions = ["Headphones", "Gaming Gear", "Fashion Items"];
          else if (age <= 40) suggestions = ["Tech Gadgets", "Personalized Gifts", "Books"];
          else suggestions = ["Health Gadgets", "Photo Frames", "Luxury Hampers"];
          break;

        case "anniversary":
          suggestions = ["Romantic Dinner", "Photo Album", "Personalized Jewelry"];
          break;

        case "festival":
          suggestions = ["Sweets Box", "Decor Items", "Traditional Wear"];
          break;

        case "wedding":
          suggestions = ["Home Decor", "Kitchen Appliances", "Customized Gifts"];
          break;

        case "babyShower":
          suggestions = ["Baby Clothes", "Toys", "Diaper Basket"];
          break;

        case "graduation":
          suggestions = ["Laptop Bag", "Inspirational Books", "Smart Pen"];
          break;

        case "valentinesDay":
          suggestions = ["Chocolates", "Jewelry", "Love Letter"];
          break;

        case "mothersDay":
          suggestions = ["Spa Kit", "Flowers", "Personalized Jewelry"];
          break;

        case "fathersDay":
          suggestions = ["Wallet", "Watch", "Gourmet Coffee Set"];
          break;

        case "housewarming":
          suggestions = ["Plants", "Candle Set", "Home Decor"];
          break;

        case "retirement":
          suggestions = ["Travel Voucher", "Hobby Kit", "Memory Scrapbook"];
          break;
      }

      if (["sad", "unhappy", "angry", "stressed", "tired", "lonely"].includes(mood)) {
        suggestions.push("Comfort Hamper", "Relaxation Kit", "Handwritten Note");
      }

      if (["happy", "excited", "celebratory"].includes(mood)) {
        suggestions.push("Surprise Gift Box", "Experience Voucher");
      }

      if (mood === "romantic") {
        suggestions.push("Candlelight Dinner Kit", "Couple Gift");
      }

      document.getElementById("result").innerHTML =
        "<strong>Suggested Gifts:</strong><br>" + suggestions.join("<br>");
    }

    // ✅ COMBINED & CLEAN INITIALIZATION
    document.addEventListener("DOMContentLoaded", function () {
      toggleAgeField();
      document.getElementById("occasion").addEventListener("change", toggleAgeField);
      document.getElementById("giftBtn").addEventListener("click", suggestGift);
    });
  </script>
</body>
</html>
